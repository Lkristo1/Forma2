<script>const RAW_EXERCISES=[{"id":1,"n":"Développé couché","en":"Bench Press","m":"Pectoraux","sec":"Triceps, Épaules","eq":"salle","eqt":"ba","lv":"Intermédiaire","ic":"🏋️","d":"Allongé sur le banc, pieds au sol. Descends la barre au niveau des tétons en contrôlant, coudes à ~45°. Pousse en expirant sans décoller les fesses."},{"id":2,"n":"Squat barre","en":"Barbell Squat","m":"Quadriceps","sec":"Fessiers, Ischio","eq":"salle","eqt":"ba","lv":"Intermédiaire","ic":"🦵","d":"Barre sur les trapèzes, pieds largeur d'épaules. Descends comme pour t'asseoir, genoux dans l'axe des orteils, dos neutre. Remonte en poussant dans les talons."},{"id":3,"n":"Soulevé de terre","en":"Deadlift","m":"Dos","sec":"Ischio, Fessiers","eq":"salle","eqt":"ba","lv":"Avancé","ic":"🏋️","d":"Barre au sol contre les tibias. Dos plat, hanches en arrière. Pousse le sol avec les jambes puis verrouille les hanches. Ne jamais arrondir le bas du dos."},{"id":4,"n":"Tractions","en":"Pull-ups","m":"Dos","sec":"Biceps","eq":"pdc","eqt":"pdc","lv":"Intermédiaire","ic":"🧗","d":"Prise pronation légèrement plus large que les épaules. Tire le menton au-dessus de la barre en descendant les omoplates. Descente contrôlée."},{"id":5,"n":"Développé militaire","en":"Overhead Press","m":"Épaules","sec":"Triceps","eq":"salle","eqt":"ba","lv":"Intermédiaire","ic":"💪","d":"Debout, barre au niveau des clavicules. Pousse verticalement en gainant les abdos et fessiers. Termine bras tendus, tête légèrement en avant."},{"id":6,"n":"Rowing barre","en":"Barbell Row","m":"Dos","sec":"Biceps, Lombaires","eq":"salle","eqt":"ba","lv":"Intermédiaire","ic":"🏋️","d":"Buste penché ~45°, dos plat. Tire la barre vers le nombril en serrant les omoplates. Contrôle la descente."},{"id":7,"n":"Développé haltères incliné","en":"Incline DB Press","m":"Pectoraux","sec":"Épaules, Triceps","eq":"halteres","eqt":"ha","lv":"Débutant","ic":"💪","d":"Banc incliné 30°. Descends les haltères au niveau de la poitrine, coudes à 45°, puis pousse en rapprochant légèrement les haltères en haut."},{"id":8,"n":"Curl biceps haltères","en":"DB Biceps Curl","m":"Biceps","sec":"Avant-bras","eq":"halteres","eqt":"ha","lv":"Débutant","ic":"💪","d":"Debout, coudes collés au buste. Monte les haltères en supination sans balancer le corps. Descente lente (2-3 s)."},{"id":9,"n":"Extension triceps poulie","en":"Triceps Pushdown","m":"Triceps","sec":"—","eq":"salle","eqt":"po","lv":"Débutant","ic":"💪","d":"Face à la poulie haute, coudes fixes contre le buste. Tends les bras vers le bas, contracte 1 s en bas, remonte lentement."},{"id":10,"n":"Presse à cuisses","en":"Leg Press","m":"Quadriceps","sec":"Fessiers","eq":"salle","eqt":"ma","lv":"Débutant","ic":"🦵","d":"Pieds largeur d'épaules sur la plateforme. Descends jusqu'à 90° sans décoller le bas du dos, pousse sans verrouiller brutalement les genoux."},{"id":11,"n":"Fentes marchées","en":"Walking Lunges","m":"Fessiers","sec":"Quadriceps","eq":"halteres","eqt":"ha","lv":"Débutant","ic":"🚶","d":"Grand pas en avant, genou arrière qui frôle le sol, buste droit. Pousse sur la jambe avant pour enchaîner sur l'autre jambe."},{"id":12,"n":"Leg curl allongé","en":"Lying Leg Curl","m":"Ischio-jambiers","sec":"—","eq":"salle","eqt":"ma","lv":"Débutant","ic":"🦵","d":"Allongé sur la machine, ramène les talons vers les fessiers en contractant les ischios. Descente contrôlée sans cambrer."},{"id":13,"n":"Élévations latérales","en":"Lateral Raises","m":"Épaules","sec":"—","eq":"halteres","eqt":"ha","lv":"Débutant","ic":"💪","d":"Léger penché en avant, coudes souples. Monte les haltères jusqu'à l'horizontale comme pour verser de l'eau. Poids léger, exécution stricte."},{"id":14,"n":"Pompes","en":"Push-ups","m":"Pectoraux","sec":"Triceps, Épaules","eq":"pdc","eqt":"pdc","lv":"Débutant","ic":"🤸","d":"Mains sous les épaules, corps gainé en planche. Descends la poitrine près du sol, coudes à 45°, puis pousse."},{"id":15,"n":"Dips","en":"Dips","m":"Triceps","sec":"Pectoraux","eq":"pdc","eqt":"pdc","lv":"Intermédiaire","ic":"🤸","d":"Sur barres parallèles, descends jusqu'à 90° de flexion de coudes, buste légèrement penché. Remonte sans verrouiller brutalement."},{"id":16,"n":"Hip thrust","en":"Hip Thrust","m":"Fessiers","sec":"Ischio","eq":"salle","eqt":"ba","lv":"Intermédiaire","ic":"🍑","d":"Dos sur un banc, barre sur les hanches. Pousse les hanches vers le haut jusqu'à l'alignement épaules-genoux, contracte fort les fessiers 1 s."},{"id":17,"n":"Tirage vertical","en":"Lat Pulldown","m":"Dos","sec":"Biceps","eq":"salle","eqt":"po","lv":"Débutant","ic":"🏋️","d":"Assis, prise large. Tire la barre vers le haut de la poitrine en sortant le buste, coudes vers le bas. Remonte en contrôlant."},{"id":18,"n":"Crunch câble","en":"Cable Crunch","m":"Abdominaux","sec":"—","eq":"salle","eqt":"po","lv":"Débutant","ic":"🧘","d":"À genoux face à la poulie haute, corde derrière la tête. Enroule le buste vers le bas en contractant les abdos, sans tirer avec les bras."},{"id":19,"n":"Planche","en":"Plank","m":"Abdominaux","sec":"Lombaires","eq":"pdc","eqt":"pdc","lv":"Débutant","ic":"🧘","d":"Appui sur les avant-bras, corps aligné tête-talons. Serre abdos et fessiers, ne laisse pas les hanches tomber. Respire normalement."},{"id":20,"n":"Squat gobelet","en":"Goblet Squat","m":"Quadriceps","sec":"Fessiers","eq":"halteres","eqt":"ha","lv":"Débutant","ic":"🦵","d":"Haltère tenu verticalement contre la poitrine. Descends entre tes jambes en gardant le buste droit, coudes à l'intérieur des genoux."},{"id":21,"n":"Rowing haltère unilatéral","en":"One-arm DB Row","m":"Dos","sec":"Biceps","eq":"halteres","eqt":"ha","lv":"Débutant","ic":"🏋️","d":"Main et genou sur le banc, dos plat. Tire l'haltère vers la hanche en gardant le coude près du corps."},{"id":22,"n":"Squat bulgare","en":"Bulgarian Split Squat","m":"Fessiers","sec":"Quadriceps","eq":"halteres","eqt":"ha","lv":"Intermédiaire","ic":"🦵","d":"Pied arrière posé sur un banc. Descends verticalement sur la jambe avant jusqu'à 90°, buste légèrement penché pour cibler les fessiers."},{"id":23,"n":"Face pull","en":"Face Pull","m":"Épaules","sec":"Trapèzes","eq":"salle","eqt":"po","lv":"Débutant","ic":"💪","d":"Corde à la poulie haute. Tire vers le visage en écartant les mains, coudes hauts. Excellent pour la santé des épaules."},{"id":24,"n":"Mollets debout","en":"Standing Calf Raise","m":"Mollets","sec":"—","eq":"salle","eqt":"ma","lv":"Débutant","ic":"🦵","d":"Monte sur la pointe des pieds le plus haut possible, pause 1 s en haut, descends en étirement complet. Amplitude avant tout."},{"id":25,"n":"Burpees","en":"Burpees","m":"Full Body","sec":"Cardio","eq":"pdc","eqt":"pdc","lv":"Intermédiaire","ic":"🔥","d":"Squat, planche, pompe optionnelle, retour pieds aux mains, saut vertical. Rythme régulier, gainage constant."},{"id":26,"n":"Gainage latéral","en":"Side Plank","m":"Abdominaux","sec":"Obliques","eq":"pdc","eqt":"pdc","lv":"Débutant","ic":"🧘","d":"Appui sur un avant-bras, corps aligné de profil. Hanches hautes, ne laisse pas le bassin tomber."},{"id":27,"n":"Développé incliné barre","en":"Incline Bench Press","m":"Pectoraux","sec":"Épaules, Triceps","eq":"salle","eqt":"ba","lv":"Intermédiaire","ic":"🏋️","d":"Banc à 30°. Descends la barre sur le haut des pectoraux, pousse en gardant les omoplates serrées."},{"id":28,"n":"Développé haltères plat","en":"Flat DB Press","m":"Pectoraux","sec":"Triceps","eq":"halteres","eqt":"ha","lv":"Débutant","ic":"💪","d":"Amplitude plus grande qu'à la barre. Descends jusqu'à l'étirement des pectoraux, pousse en convergeant légèrement."},{"id":29,"n":"Développé machine convergente","en":"Machine Chest Press","m":"Pectoraux","sec":"Triceps","eq":"salle","eqt":"ma","lv":"Débutant","ic":"🏋️","d":"Réglage du siège : poignées au niveau des pectoraux. Pousse sans verrouiller, retour lent."},{"id":30,"n":"Pec deck","en":"Pec Deck Fly","m":"Pectoraux","sec":"—","eq":"salle","eqt":"ma","lv":"Débutant","ic":"🏋️","d":"Coudes légèrement fléchis et fixes. Rapproche les bras devant toi, contracte 1 s, ouvre en contrôlant."},{"id":31,"n":"Écarté haltères","en":"DB Fly","m":"Pectoraux","sec":"—","eq":"halteres","eqt":"ha","lv":"Intermédiaire","ic":"💪","d":"Coudes semi-fléchis constants. Ouvre en arc de cercle jusqu'à l'étirement, referme comme pour enlacer un tronc."},{"id":32,"n":"Câble crossover","en":"Cable Crossover","m":"Pectoraux","sec":"—","eq":"salle","eqt":"po","lv":"Intermédiaire","ic":"🏋️","d":"Poulies hautes, un pas en avant. Ramène les mains devant les hanches en croisant légèrement, tension continue."},{"id":33,"n":"Pompes lestées","en":"Weighted Push-ups","m":"Pectoraux","sec":"Triceps","eq":"pdc","eqt":"pdc","lv":"Avancé","ic":"🎒","d":"Sac à dos lesté. Même exécution qu'une pompe stricte, gainage renforcé, descente 2 s."},{"id":34,"n":"Tractions supination","en":"Chin-ups","m":"Dos","sec":"Biceps","eq":"pdc","eqt":"pdc","lv":"Intermédiaire","ic":"🧗","d":"Paumes vers toi, prise largeur d'épaules. Tire le menton au-dessus de la barre, forte implication des biceps."},{"id":35,"n":"Tirage horizontal poulie","en":"Seated Cable Row","m":"Dos","sec":"Biceps","eq":"salle","eqt":"po","lv":"Débutant","ic":"🏋️","d":"Buste droit, tire la poignée vers le nombril en serrant les omoplates, sans balancer le dos."},{"id":36,"n":"Rowing T-bar","en":"T-Bar Row","m":"Dos","sec":"Biceps","eq":"salle","eqt":"ba","lv":"Intermédiaire","ic":"🏋️","d":"Buste penché 45°, tire la barre vers le sternum. Charge lourde possible, dos toujours plat."},{"id":37,"n":"Pull-over poulie bras tendus","en":"Straight-arm Pulldown","m":"Dos","sec":"Triceps","eq":"salle","eqt":"po","lv":"Débutant","ic":"🏋️","d":"Bras quasi tendus, amène la barre des yeux vers les cuisses en contractant les dorsaux."},{"id":38,"n":"Extension lombaire","en":"Back Extension","m":"Dos","sec":"Ischio, Fessiers","eq":"salle","eqt":"pdc","lv":"Débutant","ic":"🧘","d":"Sur banc à lombaires. Remonte le buste jusqu'à l'alignement, sans hyperextension."},{"id":39,"n":"Shrugs haltères","en":"DB Shrugs","m":"Dos","sec":"Trapèzes","eq":"halteres","eqt":"ha","lv":"Débutant","ic":"💪","d":"Hausse les épaules verticalement vers les oreilles, pause 1 s en haut, sans rouler les épaules."},{"id":40,"n":"Rack pull","en":"Rack Pull","m":"Dos","sec":"Trapèzes, Fessiers","eq":"salle","eqt":"ba","lv":"Avancé","ic":"🏋️","d":"Soulevé de terre partiel depuis les supports à hauteur de genoux. Verrouille les hanches en serrant les fessiers."},{"id":41,"n":"Développé haltères assis","en":"Seated DB Shoulder Press","m":"Épaules","sec":"Triceps","eq":"halteres","eqt":"ha","lv":"Débutant","ic":"💪","d":"Dos calé sur le dossier. Pousse les haltères au-dessus de la tête sans les entrechoquer, descente aux oreilles."},{"id":42,"n":"Développé Arnold","en":"Arnold Press","m":"Épaules","sec":"Triceps","eq":"halteres","eqt":"ha","lv":"Intermédiaire","ic":"💪","d":"Départ paumes vers toi, rotation pendant la montée pour finir paumes vers l'avant."},{"id":43,"n":"Élévations frontales","en":"Front Raises","m":"Épaules","sec":"—","eq":"halteres","eqt":"ha","lv":"Débutant","ic":"💪","d":"Monte l'haltère devant toi jusqu'à hauteur d'yeux, bras quasi tendu, sans élan du buste."},{"id":44,"n":"Oiseau","en":"Rear Delt Fly","m":"Épaules","sec":"Trapèzes","eq":"halteres","eqt":"ha","lv":"Débutant","ic":"💪","d":"Buste penché, ouvre les bras sur les côtés en visant l'arrière d'épaule, pouces légèrement vers le bas."},{"id":45,"n":"Tirage menton","en":"Upright Row","m":"Épaules","sec":"Trapèzes","eq":"salle","eqt":"po","lv":"Intermédiaire","ic":"🏋️","d":"Prise large recommandée. Tire la barre le long du corps jusqu'au sternum, coudes au-dessus des mains."},{"id":46,"n":"Curl barre EZ","en":"EZ-Bar Curl","m":"Biceps","sec":"Avant-bras","eq":"salle","eqt":"ba","lv":"Débutant","ic":"🏋️","d":"Prise EZ plus confortable pour les poignets. Coudes fixes, montée complète, descente 2-3 s."},{"id":47,"n":"Curl marteau","en":"Hammer Curl","m":"Biceps","sec":"Avant-bras","eq":"halteres","eqt":"ha","lv":"Débutant","ic":"💪","d":"Prise neutre (paumes face à face). Cible le brachial et les avant-bras, très bon transfert de force."},{"id":48,"n":"Curl pupitre","en":"Preacher Curl","m":"Biceps","sec":"—","eq":"salle","eqt":"ba","lv":"Intermédiaire","ic":"🏋️","d":"Bras calés sur le pupitre : impossible de tricher. Étirement complet en bas sans verrouiller brutalement."},{"id":49,"n":"Curl incliné","en":"Incline DB Curl","m":"Biceps","sec":"—","eq":"halteres","eqt":"ha","lv":"Intermédiaire","ic":"💪","d":"Assis sur banc incliné 45°, bras pendants derrière le corps : étirement maximal de la longue portion."},{"id":50,"n":"Curl poulie basse","en":"Cable Curl","m":"Biceps","sec":"—","eq":"salle","eqt":"po","lv":"Débutant","ic":"🏋️","d":"Tension continue sur toute l'amplitude. Coudes collés, contraction 1 s en haut."},{"id":51,"n":"Barre au front","en":"Skullcrusher","m":"Triceps","sec":"—","eq":"salle","eqt":"ba","lv":"Intermédiaire","ic":"🏋️","d":"Allongé, descends la barre EZ vers le front en fléchissant uniquement les coudes, puis tends."},{"id":52,"n":"Extension nuque haltère","en":"Overhead Triceps Extension","m":"Triceps","sec":"—","eq":"halteres","eqt":"ha","lv":"Débutant","ic":"💪","d":"Haltère à deux mains derrière la nuque. Tends les bras au-dessus de la tête, coudes serrés."},{"id":53,"n":"Développé prise serrée","en":"Close-grip Bench","m":"Triceps","sec":"Pectoraux","eq":"salle","eqt":"ba","lv":"Intermédiaire","ic":"🏋️","d":"Prise largeur d'épaules, coudes le long du corps. Le meilleur exercice de force pour les triceps."},{"id":54,"n":"Kickback","en":"Triceps Kickback","m":"Triceps","sec":"—","eq":"halteres","eqt":"ha","lv":"Débutant","ic":"💪","d":"Buste penché, bras parallèle au sol. Tends l'avant-bras vers l'arrière, contracte 1 s."},{"id":55,"n":"Front squat","en":"Front Squat","m":"Quadriceps","sec":"Abdominaux, Fessiers","eq":"salle","eqt":"ba","lv":"Avancé","ic":"🏋️","d":"Barre sur les épaules avant, coudes hauts. Buste très droit, cible davantage les quadriceps."},{"id":56,"n":"Hack squat","en":"Hack Squat","m":"Quadriceps","sec":"Fessiers","eq":"salle","eqt":"ma","lv":"Intermédiaire","ic":"🏋️","d":"Dos plaqué sur la machine. Descends profond, pousse dans tout le pied sans décoller les talons."},{"id":57,"n":"Leg extension","en":"Leg Extension","m":"Quadriceps","sec":"—","eq":"salle","eqt":"ma","lv":"Débutant","ic":"🦵","d":"Tends les jambes en contractant les quadriceps, pause 1 s en haut, descente contrôlée."},{"id":58,"n":"Step-up","en":"Step-up","m":"Quadriceps","sec":"Fessiers","eq":"halteres","eqt":"ha","lv":"Débutant","ic":"🦵","d":"Monte sur un banc en poussant uniquement sur la jambe d'appui, sans élan de la jambe arrière."},{"id":59,"n":"Squat sumo","en":"Sumo Squat","m":"Quadriceps","sec":"Adducteurs, Fessiers","eq":"halteres","eqt":"ha","lv":"Débutant","ic":"🦵","d":"Pieds très écartés, pointes ouvertes. Descends entre les jambes, genoux dans l'axe."},{"id":60,"n":"Soulevé de terre roumain","en":"Romanian Deadlift","m":"Ischio-jambiers","sec":"Fessiers, Lombaires","eq":"salle","eqt":"ba","lv":"Intermédiaire","ic":"🏋️","d":"Jambes quasi tendues, hanches en arrière. Descends la barre le long des jambes jusqu'à l'étirement des ischios."},{"id":61,"n":"Leg curl assis","en":"Seated Leg Curl","m":"Ischio-jambiers","sec":"—","eq":"salle","eqt":"ma","lv":"Débutant","ic":"🦵","d":"Ramène les talons sous le siège. Position assise = ischios plus étirés = meilleur recrutement."},{"id":62,"n":"Good morning","en":"Good Morning","m":"Ischio-jambiers","sec":"Lombaires, Fessiers","eq":"salle","eqt":"ba","lv":"Avancé","ic":"🏋️","d":"Barre sur les trapèzes, penche le buste hanches en arrière jusqu'à l'horizontale, dos plat impératif."},{"id":63,"n":"Nordic curl","en":"Nordic Curl","m":"Ischio-jambiers","sec":"—","eq":"pdc","eqt":"pdc","lv":"Avancé","ic":"🤸","d":"Chevilles bloquées, laisse-toi descendre vers l'avant en freinant avec les ischios. Excentrique brutal mais très efficace."},{"id":64,"n":"Glute bridge","en":"Glute Bridge","m":"Fessiers","sec":"Ischio","eq":"pdc","eqt":"pdc","lv":"Débutant","ic":"🍑","d":"Allongé au sol, pousse les hanches vers le ciel en contractant fort les fessiers 2 s."},{"id":65,"n":"Kickback poulie","en":"Cable Glute Kickback","m":"Fessiers","sec":"—","eq":"salle","eqt":"po","lv":"Débutant","ic":"🍑","d":"Sangle à la cheville, tends la jambe vers l'arrière sans cambrer le bas du dos."},{"id":66,"n":"Abduction machine","en":"Hip Abduction","m":"Fessiers","sec":"—","eq":"salle","eqt":"ma","lv":"Débutant","ic":"🍑","d":"Écarte les genoux contre la résistance, buste penché en avant pour cibler le moyen fessier."},{"id":67,"n":"Soulevé de terre sumo","en":"Sumo Deadlift","m":"Fessiers","sec":"Quadriceps, Dos","eq":"salle","eqt":"ba","lv":"Avancé","ic":"🏋️","d":"Pieds très écartés, prise à l'intérieur des genoux. Buste plus droit qu'au conventionnel."},{"id":68,"n":"Mollets assis","en":"Seated Calf Raise","m":"Mollets","sec":"—","eq":"salle","eqt":"ma","lv":"Débutant","ic":"🦵","d":"Genoux fléchis : cible le soléaire. Amplitude complète, pause en haut et en étirement."},{"id":69,"n":"Mollets à la presse","en":"Calf Press","m":"Mollets","sec":"—","eq":"salle","eqt":"ma","lv":"Débutant","ic":"🦵","d":"Pointes de pieds en bas de la plateforme. Pousse uniquement avec les chevilles, jambes tendues."},{"id":70,"n":"Relevé de jambes suspendu","en":"Hanging Leg Raise","m":"Abdominaux","sec":"Fléchisseurs de hanche","eq":"pdc","eqt":"pdc","lv":"Avancé","ic":"🧗","d":"Suspendu à la barre, monte les jambes tendues (ou genoux) en enroulant le bassin, sans balancier."},{"id":71,"n":"Crunch au sol","en":"Floor Crunch","m":"Abdominaux","sec":"—","eq":"pdc","eqt":"pdc","lv":"Débutant","ic":"🧘","d":"Décolle les omoplates en enroulant le buste, regard vers le plafond, lombaires au sol."},{"id":72,"n":"Russian twist","en":"Russian Twist","m":"Abdominaux","sec":"Obliques","eq":"pdc","eqt":"pdc","lv":"Débutant","ic":"🧘","d":"Assis en V, pieds décollés. Tourne le buste de gauche à droite avec ou sans poids."},{"id":73,"n":"Roulette abdos","en":"Ab Wheel Rollout","m":"Abdominaux","sec":"Lombaires","eq":"pdc","eqt":"pdc","lv":"Avancé","ic":"🛞","d":"À genoux, roule vers l'avant en gardant le gainage, sans creuser le bas du dos. Amplitude progressive."},{"id":74,"n":"Mountain climbers","en":"Mountain Climbers","m":"Abdominaux","sec":"Cardio","eq":"pdc","eqt":"pdc","lv":"Débutant","ic":"🔥","d":"En position de planche, ramène les genoux vers la poitrine en alternance rapide, hanches basses."},{"id":75,"n":"Kettlebell swing","en":"Kettlebell Swing","m":"Full Body","sec":"Fessiers, Cardio","eq":"halteres","eqt":"kb","lv":"Intermédiaire","ic":"🔔","d":"Mouvement de hanche explosif : la kettlebell monte grâce à l'extension des hanches, pas des bras."},{"id":76,"n":"Thruster","en":"Thruster","m":"Full Body","sec":"Épaules, Quadriceps","eq":"halteres","eqt":"ba","lv":"Intermédiaire","ic":"🔥","d":"Front squat + développé au-dessus de la tête dans un seul mouvement fluide."},{"id":77,"n":"Farmer walk","en":"Farmer Walk","m":"Full Body","sec":"Trapèzes, Avant-bras","eq":"halteres","eqt":"ha","lv":"Débutant","ic":"🚶","d":"Marche avec charges lourdes dans chaque main, buste droit, épaules basses, pas contrôlés."},{"id":78,"n":"Rameur","en":"Rowing Machine","m":"Full Body","sec":"Dos, Cardio","eq":"salle","eqt":"ma","lv":"Débutant","ic":"🚣","d":"Séquence jambes-buste-bras à l'aller, bras-buste-jambes au retour. 80% de la puissance vient des jambes."},{"id":79,"n":"Jumping jacks","en":"Jumping Jacks","m":"Full Body","sec":"Cardio","eq":"pdc","eqt":"pdc","lv":"Débutant","ic":"🔥","d":"Saute en écartant bras et jambes simultanément, puis referme. Rythme régulier, réception souple."},{"id":80,"n":"Montées de genoux","en":"High Knees","m":"Full Body","sec":"Cardio","eq":"pdc","eqt":"pdc","lv":"Débutant","ic":"🔥","d":"Cours sur place en montant les genoux à hauteur de hanches, bras dynamiques, buste droit."},{"id":81,"n":"Squats sautés","en":"Jump Squats","m":"Quadriceps","sec":"Fessiers, Cardio","eq":"pdc","eqt":"pdc","lv":"Intermédiaire","ic":"🔥","d":"Squat complet puis extension explosive en saut. Réception amortie en douceur, enchaîne."},{"id":82,"n":"Planche commando","en":"Plank Up-Down","m":"Abdominaux","sec":"Épaules, Triceps","eq":"pdc","eqt":"pdc","lv":"Intermédiaire","ic":"🔥","d":"Alterne planche sur les coudes et planche bras tendus, sans balancer les hanches."},{"id":83,"n":"Patineurs","en":"Skaters","m":"Full Body","sec":"Fessiers, Cardio","eq":"pdc","eqt":"pdc","lv":"Débutant","ic":"⛸️","d":"Bonds latéraux d'une jambe sur l'autre comme un patineur, bras en balancier, gainage actif."},{"id":84,"n":"Sprint sur place","en":"Sprint in Place","m":"Full Body","sec":"Cardio","eq":"pdc","eqt":"pdc","lv":"Débutant","ic":"💨","d":"Course sur place à intensité maximale, fréquence de pas très rapide, bras à 90°."},{"id":85,"n":"Crunch vélo","en":"Bicycle Crunch","m":"Abdominaux","sec":"Obliques","eq":"pdc","eqt":"pdc","lv":"Débutant","ic":"🚲","d":"Allongé, coude vers le genou opposé en alternance, jambe libre tendue. Mouvement lent et contrôlé."},{"id":86,"n":"Superman","en":"Superman","m":"Dos","sec":"Fessiers, Lombaires","eq":"pdc","eqt":"pdc","lv":"Débutant","ic":"🦸","d":"Allongé sur le ventre, décolle bras et jambes en contractant le dos, 2 s de pause en haut."},{"id":87,"n":"Shadow boxing","en":"Shadow Boxing","m":"Full Body","sec":"Épaules, Cardio","eq":"pdc","eqt":"pdc","lv":"Débutant","ic":"🥊","d":"Enchaîne jab, cross et crochets dans le vide, garde haute, déplacements légers sur les appuis."},{"id":88,"n":"Corde à sauter","en":"Jump Rope","m":"Full Body","sec":"Mollets, Cardio","eq":"pdc","eqt":"pdc","lv":"Débutant","ic":"🪢","d":"Petits sauts sur la pointe des pieds, poignets qui tournent, épaules relâchées. Sans corde, mime le geste."},{"id":89,"n":"SkiErg","en":"SkiErg","m":"Full Body","sec":"Dos, Triceps, Cardio","eq":"salle","eqt":"ma","lv":"Intermédiaire","ic":"🎿","d":"Station Hyrox. Attrape les poignées bras hauts, engage les abdos et tire vers le bas en fermant le buste, hanches en arrière. La puissance vient du tronc, pas des bras."},{"id":90,"n":"Poussée de traîneau","en":"Sled Push","m":"Quadriceps","sec":"Fessiers, Mollets, Cardio","eq":"salle","eqt":"ma","lv":"Intermédiaire","ic":"🛷","d":"Station Hyrox. Bras tendus, corps incliné vers l'avant, regard au sol. Pousse par petits pas rapides sans jamais t'arrêter, la respiration reste régulière."},{"id":91,"n":"Traction de traîneau","en":"Sled Pull","m":"Dos","sec":"Biceps, Fessiers","eq":"salle","eqt":"ma","lv":"Intermédiaire","ic":"🪢","d":"Station Hyrox. Recule en tirant la corde main sur main, hanches basses et dos plat. Utilise le poids du corps plutôt que la force des bras."},{"id":92,"n":"Burpee broad jump","en":"Burpee Broad Jump","m":"Full Body","sec":"Cardio","eq":"pdc","eqt":"pdc","lv":"Avancé","ic":"🐸","d":"Station Hyrox. Burpee complet puis saut en longueur pieds joints. Réceptionne genoux souples et enchaîne, c'est le rythme qui compte plus que la hauteur."},{"id":93,"n":"Fentes sac lesté","en":"Sandbag Lunges","m":"Quadriceps","sec":"Fessiers, Abdominaux","eq":"salle","eqt":"ha","lv":"Avancé","ic":"🎒","d":"Station Hyrox. Sac sur les épaules, fentes marchées, genou arrière au sol à chaque pas. Buste droit, abdos serrés pour protéger le bas du dos."},{"id":94,"n":"Wall balls","en":"Wall Balls","m":"Quadriceps","sec":"Épaules, Cardio","eq":"salle","eqt":"ha","lv":"Intermédiaire","ic":"🏐","d":"Station Hyrox. Squat complet avec le médecine-ball à la poitrine, puis lance-le sur la cible en remontant. Rattrape en amortissant directement dans le squat suivant."},{"id":95,"n":"Box jump","en":"Box Jump","m":"Quadriceps","sec":"Fessiers, Mollets","eq":"salle","eqt":"pdc","lv":"Intermédiaire","ic":"📦","d":"Fléchis, arme les bras et saute des deux pieds sur la box. Réceptionne jambes fléchies, redresse-toi complètement puis redescends en contrôlant (ou en step-down)."},{"id":96,"n":"Battle ropes","en":"Battle Ropes","m":"Épaules","sec":"Dos, Abdominaux, Cardio","eq":"salle","eqt":"ma","lv":"Débutant","ic":"🌊","d":"Genoux souples, gainage actif. Fais claquer des vagues alternées à un rythme soutenu, épaules basses et respiration continue."},{"id":97,"n":"Devil press","en":"Devil Press","m":"Full Body","sec":"Épaules, Cardio","eq":"halteres","eqt":"ha","lv":"Avancé","ic":"😈","d":"Burpee haltères en main, puis remontée en un mouvement fluide jusqu'au-dessus de la tête. Garde le dos plat au moment du swing."},{"id":98,"n":"Bear crawl","en":"Bear Crawl","m":"Abdominaux","sec":"Épaules, Quadriceps","eq":"pdc","eqt":"pdc","lv":"Débutant","ic":"🐻","d":"Genoux à 3 cm du sol, dos plat comme une table. Avance main et pied opposés en même temps, sans laisser les hanches osciller."},{"id":99,"n":"Turkish get-up","en":"Turkish Get-Up","m":"Full Body","sec":"Épaules, Abdominaux","eq":"halteres","eqt":"ha","lv":"Avancé","ic":"🕌","d":"Du sol jusqu'à debout, bras tendu au-dessus de la tête, en gardant les yeux sur le poids. Un mouvement lent, technique avant charge."},{"id":100,"n":"Assault bike","en":"Assault Bike","m":"Full Body","sec":"Cardio","eq":"salle","eqt":"ma","lv":"Débutant","ic":"🚲","d":"Bras et jambes travaillent ensemble. Pour les intervalles, démarre fort les 10 premières secondes puis tiens la cadence sans t'écrouler."},{"id":101,"n":"Step-up sur box","en":"Box Step-Up","m":"Fessiers","sec":"Quadriceps","eq":"halteres","eqt":"ha","lv":"Débutant","ic":"🪜","d":"Pose tout le pied sur la box, pousse dans le talon sans t'aider de la jambe arrière. Descente contrôlée, alterne les jambes."},{"id":102,"n":"Arraché haltère","en":"Dumbbell Snatch","m":"Épaules","sec":"Dos, Fessiers","eq":"halteres","eqt":"ha","lv":"Avancé","ic":"⚡","d":"Haltère entre les pieds, dos plat. Explose des hanches et amène l'haltère au-dessus de la tête en un seul mouvement, bras verrouillé en fin de course."},{"id":103,"n":"Passes de médecine-ball","en":"Med-ball Chest Pass","m":"Pectoraux","sec":"Triceps, Abdominaux","eq":"salle","eqt":"ha","lv":"Débutant","ic":"🤾","duo":1,"d":"À deux, face à face à 3 m. Pousse le ballon depuis la poitrine en gainant, réceptionne en amortissant. Enchaîne sans temps mort."},{"id":104,"n":"Squat dos à dos","en":"Partner Wall Squat","m":"Quadriceps","sec":"Fessiers, Abdominaux","eq":"pdc","eqt":"pdc","lv":"Débutant","ic":"🧍","duo":1,"d":"Dos contre dos, descendez ensemble jusqu'à la chaise et tenez. Vous vous servez mutuellement d'appui : personne ne lâche avant l'autre."},{"id":105,"n":"Planche tape-mains","en":"Partner Plank Hand Tap","m":"Abdominaux","sec":"Épaules","eq":"pdc","eqt":"pdc","lv":"Intermédiaire","ic":"🙌","duo":1,"d":"En planche face à face, tapez la main opposée à tour de rôle. Bassin stable, ne laisse pas les hanches tourner."},{"id":106,"n":"Relais navette","en":"Partner Shuttle Relay","m":"Full Body","sec":"Cardio","eq":"pdc","eqt":"pdc","lv":"Débutant","ic":"🏃","duo":1,"d":"L'un court la navette pendant que l'autre récupère, puis on échange. Le repos de l'un est le travail de l'autre."},{"id":107,"n":"Burpees synchronisés","en":"Synchro Burpees","m":"Full Body","sec":"Cardio","eq":"pdc","eqt":"pdc","lv":"Intermédiaire","ic":"🔥","duo":1,"d":"Même rythme du début à la fin. Le plus rapide s'aligne sur le plus lent : c'est l'exercice qui soude une séance."},{"id":108,"n":"Fentes avec passe de ballon","en":"Partner Lunge Pass","m":"Fessiers","sec":"Quadriceps, Abdominaux","eq":"salle","eqt":"ha","lv":"Débutant","ic":"⚽","duo":1,"d":"Fente en descendant, passe le ballon à ton partenaire en bas de mouvement, remonte. Buste droit tout du long."},{"id":109,"n":"Traction assistée par le partenaire","en":"Assisted Pull-up","m":"Dos","sec":"Biceps","eq":"pdc","eqt":"pdc","lv":"Débutant","ic":"🤝","duo":1,"d":"Ton partenaire soutient tes hanches juste assez pour que tu montes en contrôle. Il réduit l'aide série après série."},{"id":110,"n":"Résistance manuelle sur curl","en":"Partner Manual Curl","m":"Biceps","sec":"Avant-bras","eq":"pdc","eqt":"pdc","lv":"Intermédiaire","ic":"💪","duo":1,"d":"Ton partenaire freine la montée puis résiste sur la descente, plus lentement encore. 4 s à la descente minimum."},{"id":111,"n":"Sit-up avec passe","en":"Partner Sit-up Pass","m":"Abdominaux","sec":"Épaules","eq":"salle","eqt":"ha","lv":"Débutant","ic":"🏐","duo":1,"d":"Pieds croisés face à face, remontez ensemble et échangez le ballon en haut. Le bas du dos se déroule vertèbre par vertèbre."},{"id":112,"n":"Wheelbarrow (brouette)","en":"Wheelbarrow Walk","m":"Épaules","sec":"Abdominaux, Pectoraux","eq":"pdc","eqt":"pdc","lv":"Avancé","ic":"🛒","duo":1,"d":"L'un tient les chevilles de l'autre qui avance sur les mains, corps parfaitement gainé. 10 à 15 m puis on échange."},{"id":120,"n":"Shrug barre","en":"Barbell Shrug","m":"Trapèzes","sec":"Avant-bras","eq":"salle","eqt":"ba","lv":"Débutant","ic":"🏋️","d":"Hausse les épaules vers les oreilles sans rouler, pause 1 s en haut, descente contrôlée. Ne tire jamais avec les bras."},{"id":121,"n":"Y-raise banc incliné","en":"Incline Y-Raise","m":"Trapèzes","sec":"Épaules","eq":"halteres","eqt":"ha","lv":"Débutant","ic":"💪","d":"Buste sur un banc à 30°, monte les bras en Y pouces vers le haut. Trapèze inférieur, charge très légère."},{"id":122,"n":"Rowing menton au banc","en":"Chest-Supported Row","m":"Trapèzes","sec":"Dos","eq":"salle","eqt":"ma","lv":"Débutant","ic":"🏋️","d":"Buste calé, tire les coudes vers l'arrière en serrant les omoplates. Aucun élan possible, c'est tout l'intérêt."},{"id":123,"n":"Hyperextension lestée","en":"Weighted Back Extension","m":"Lombaires","sec":"Fessiers, Ischio","eq":"salle","eqt":"ma","lv":"Débutant","ic":"🧘","d":"Remonte jusqu'à l'alignement, pas au-delà. Tenue 1 s en haut, redescente lente."},{"id":124,"n":"Bird-dog","en":"Bird Dog","m":"Lombaires","sec":"Abdominaux","eq":"pdc","eqt":"pdc","lv":"Débutant","ic":"🐕","d":"À quatre pattes, tends bras et jambe opposés sans que le bassin bouge. L'un des trois piliers du protocole McGill contre la lombalgie."},{"id":125,"n":"Superman alterné","en":"Alternating Superman","m":"Lombaires","sec":"Fessiers","eq":"pdc","eqt":"pdc","lv":"Débutant","ic":"🦸","d":"À plat ventre, décolle bras et jambe opposés de quelques centimètres, 2 s de tenue. Amplitude courte, contrôle maximal."},{"id":126,"n":"Pallof press","en":"Pallof Press","m":"Obliques","sec":"Abdominaux","eq":"salle","eqt":"po","lv":"Débutant","ic":"🧊","d":"De profil à la poulie, tends les bras devant toi en résistant à la rotation. Anti-rotation : rien ne doit tourner."},{"id":127,"n":"Woodchopper poulie","en":"Cable Woodchopper","m":"Obliques","sec":"Abdominaux","eq":"salle","eqt":"po","lv":"Intermédiaire","ic":"🪓","d":"Diagonale haute vers basse, rotation venant des hanches, bras tendus. Contrôle le retour."},{"id":128,"n":"Suitcase carry","en":"Suitcase Carry","m":"Obliques","sec":"Avant-bras, Trapèzes","eq":"halteres","eqt":"ha","lv":"Débutant","ic":"💼","d":"Une charge d'un seul côté, marche droit sans t'incliner. 20 à 40 m, puis on change de main."},{"id":129,"n":"Side plank avec abduction","en":"Side Plank + Abduction","m":"Obliques","sec":"Fessiers","eq":"pdc","eqt":"pdc","lv":"Intermédiaire","ic":"🧘","d":"Gainage latéral, monte la jambe du dessus sans basculer le bassin. Deuxième pilier du protocole McGill."},{"id":130,"n":"Dead bug","en":"Dead Bug","m":"Abdominaux","sec":"Lombaires","eq":"pdc","eqt":"pdc","lv":"Débutant","ic":"🪲","d":"Dos plaqué au sol, tends bras et jambe opposés lentement. Si le bas du dos décolle, réduis l'amplitude."},{"id":131,"n":"Curl-up McGill","en":"McGill Curl-Up","m":"Abdominaux","sec":"Lombaires","eq":"pdc","eqt":"pdc","lv":"Débutant","ic":"🧊","d":"Mains sous le bas du dos, une jambe fléchie, décolle à peine la tête et les épaules. Tenue 8 s. Aucun mouvement lombaire."},{"id":132,"n":"Curl incliné haltères","en":"Incline DB Curl","m":"Biceps","sec":"Avant-bras","eq":"halteres","eqt":"ha","lv":"Intermédiaire","ic":"💪","d":"Banc à 45°, bras derrière le corps : tension maximale en position étirée, la plus efficace pour le biceps."},{"id":133,"n":"Curl Bayesian poulie","en":"Bayesian Curl","m":"Biceps","sec":"—","eq":"salle","eqt":"po","lv":"Intermédiaire","ic":"🏋️","d":"Dos à la poulie basse, bras en arrière du buste. Tension continue sur toute l'amplitude."},{"id":134,"n":"Curl inversé EZ","en":"Reverse EZ Curl","m":"Avant-bras","sec":"Biceps","eq":"salle","eqt":"ba","lv":"Débutant","ic":"🏋️","d":"Prise pronation, monte sans balancer. Cible le brachio-radial et les extenseurs du poignet."},{"id":135,"n":"Curl poignets barre","en":"Wrist Curl","m":"Avant-bras","sec":"—","eq":"salle","eqt":"ba","lv":"Débutant","ic":"🤲","d":"Avant-bras posés, seuls les poignets bougent. Amplitude complète, charge légère, 15 à 20 reps."},{"id":136,"n":"Suspension à la barre","en":"Dead Hang","m":"Avant-bras","sec":"Dos","eq":"pdc","eqt":"pdc","lv":"Débutant","ic":"🧗","d":"Suspendu bras tendus, épaules actives. 30 à 60 s. Excellent pour la poigne et la décompression de l'épaule."},{"id":137,"n":"Extension triceps poulie au-dessus de la tête","en":"Overhead Cable Extension","m":"Triceps","sec":"—","eq":"salle","eqt":"po","lv":"Intermédiaire","ic":"🏋️","d":"Bras au-dessus de la tête, coudes fixes : la longue portion du triceps est en étirement, c'est là qu'elle travaille le mieux."},{"id":138,"n":"Barre au front EZ","en":"EZ Skullcrusher","m":"Triceps","sec":"—","eq":"salle","eqt":"ba","lv":"Intermédiaire","ic":"🏋️","d":"Descends la barre vers le front ou légèrement derrière, coudes immobiles. Contrôle absolu, jamais d'à-coup."},{"id":139,"n":"Pompes diamant","en":"Diamond Push-up","m":"Triceps","sec":"Pectoraux","eq":"pdc","eqt":"pdc","lv":"Intermédiaire","ic":"💎","d":"Mains jointes sous la poitrine, coudes le long du corps. La version sans matériel la plus efficace pour les triceps."},{"id":140,"n":"Nordic curl assisté","en":"Assisted Nordic Curl","m":"Ischio-jambiers","sec":"—","eq":"pdc","eqt":"pdc","lv":"Intermédiaire","ic":"🦵","d":"Chevilles bloquées, descente freinée le plus longtemps possible, remontée à l'aide des mains. Excentrique de référence contre les lésions d'ischios."},{"id":141,"n":"Leg curl nordique à l'élastique","en":"Banded Nordic Curl","m":"Ischio-jambiers","sec":"—","eq":"halteres","eqt":"el","lv":"Débutant","ic":"🦵","d":"Élastique passé sous la poitrine pour alléger la descente. Freine le plus longtemps possible, remonte en poussant avec les mains."},{"id":142,"n":"Soulevé de terre roumain haltères","en":"DB Romanian Deadlift","m":"Ischio-jambiers","sec":"Fessiers, Lombaires","eq":"halteres","eqt":"ha","lv":"Débutant","ic":"💪","d":"Hanches vers l'arrière, jambes presque tendues, dos plat. Descends jusqu'à l'étirement, pas plus bas."},{"id":143,"n":"Fente latérale","en":"Lateral Lunge","m":"Adducteurs","sec":"Quadriceps, Fessiers","eq":"halteres","eqt":"ha","lv":"Débutant","ic":"🦵","d":"Grand pas de côté, assieds-toi sur la jambe fléchie, l'autre reste tendue. Buste droit."},{"id":144,"n":"Copenhagen plank","en":"Copenhagen Plank","m":"Adducteurs","sec":"Obliques","eq":"pdc","eqt":"pdc","lv":"Avancé","ic":"🧘","d":"Gainage latéral, jambe du dessus posée sur un banc, on pousse dedans. Référence en prévention des pubalgies."},{"id":145,"n":"Machine adducteurs","en":"Hip Adduction Machine","m":"Adducteurs","sec":"—","eq":"salle","eqt":"ma","lv":"Débutant","ic":"🦵","d":"Serre les cuisses en contrôlant l'ouverture. Amplitude complète, tempo lent."},{"id":146,"n":"Mollets une jambe","en":"Single-Leg Calf Raise","m":"Mollets","sec":"—","eq":"pdc","eqt":"pdc","lv":"Débutant","ic":"🦵","d":"Sur une marche, amplitude maximale, 2 s en haut. Sans matériel, c'est la seule façon de charger assez le mollet."},{"id":147,"n":"Squat bulgare haltères","en":"Bulgarian Split Squat","m":"Quadriceps","sec":"Fessiers","eq":"halteres","eqt":"ha","lv":"Intermédiaire","ic":"🦵","d":"Pied arrière sur un banc, descends vertical. Buste droit pour les quadriceps, penché pour les fessiers."},{"id":148,"n":"Hack squat machine","en":"Hack Squat","m":"Quadriceps","sec":"Fessiers","eq":"salle","eqt":"ma","lv":"Intermédiaire","ic":"🦵","d":"Dos calé, pieds bas pour insister sur les quadriceps. Descends jusqu'à 90° minimum."},{"id":149,"n":"Abduction hanche poulie","en":"Cable Hip Abduction","m":"Fessiers","sec":"—","eq":"salle","eqt":"po","lv":"Débutant","ic":"🍑","d":"Jambe tendue vers l'extérieur, buste immobile. Cible le moyen fessier, clé pour la stabilité du genou."},{"id":150,"n":"Rotation externe élastique","en":"Band External Rotation","m":"Épaules","sec":"Coiffe des rotateurs","eq":"halteres","eqt":"el","lv":"Débutant","ic":"🎗️","d":"Coude au corps à 90°, ouvre vers l'extérieur lentement. Base du renforcement de la coiffe des rotateurs."},{"id":151,"n":"Tirage horizontal élastique","en":"Band Row","m":"Dos","sec":"Biceps","eq":"halteres","eqt":"el","lv":"Débutant","ic":"🎗️","d":"Élastique ancré devant toi, tire vers le nombril en serrant les omoplates."},{"id":152,"n":"Monster walk élastique","en":"Band Monster Walk","m":"Fessiers","sec":"Adducteurs","eq":"halteres","eqt":"el","lv":"Débutant","ic":"🎗️","d":"Élastique aux chevilles ou aux genoux, pas latéraux en position demi-squat. Moyen fessier et stabilité du genou."},{"id":153,"n":"Clamshell","en":"Clamshell","m":"Fessiers","sec":"—","eq":"pdc","eqt":"pdc","lv":"Débutant","ic":"🐚","d":"Sur le côté, genoux fléchis, ouvre le genou du dessus sans basculer le bassin. Protocole de référence du syndrome fémoro-patellaire."},{"id":154,"n":"Chin tuck","en":"Chin Tuck","m":"Trapèzes","sec":"Cervicales","eq":"pdc","eqt":"pdc","lv":"Débutant","ic":"💻","d":"Recule le menton comme pour faire un double menton, 10 s de tenue. Fléchisseurs profonds du cou, contre les douleurs d'écran."},{"id":155,"n":"Excentrique mollet sur marche","en":"Eccentric Heel Drop","m":"Mollets","sec":"—","eq":"pdc","eqt":"pdc","lv":"Débutant","ic":"🩹","d":"Monte sur deux pieds, descends sur un seul très lentement. Protocole d'Alfredson pour la tendinopathie d'Achille : 3×15, deux fois par jour."},{"id":156,"n":"Squat sur plan incliné","en":"Decline Squat","m":"Quadriceps","sec":"—","eq":"pdc","eqt":"pdc","lv":"Intermédiaire","ic":"🩹","d":"Talons surélevés sur un plan à 25°, descente lente sur une jambe. Protocole de référence de la tendinopathie rotulienne."},{"id":157,"n":"Équilibre unipodal","en":"Single-Leg Balance","m":"Mollets","sec":"Abdominaux","eq":"pdc","eqt":"pdc","lv":"Débutant","ic":"🦶","d":"Tiens 30 s sur un pied, puis yeux fermés. Le travail proprioceptif réduit nettement les récidives d'entorse."},{"id":158,"n":"Assis-debout chronométré","en":"Sit-to-Stand","m":"Quadriceps","sec":"Fessiers","eq":"pdc","eqt":"pdc","lv":"Débutant","ic":"🪑","d":"Depuis une chaise, sans les mains, le plus vite possible en restant contrôlé. Indicateur clé de l'autonomie après 60 ans."},{"id":159,"n":"Respiration diaphragmatique","en":"Diaphragmatic Breathing","m":"Abdominaux","sec":"Périnée","eq":"pdc","eqt":"pdc","lv":"Débutant","ic":"🌬️","d":"Inspire par le ventre, expire en rentrant doucement le nombril. Base de la reprise post-partum et du contrôle de la pression abdominale."},{"id":160,"n":"Contraction du périnée","en":"Pelvic Floor Contraction","m":"Abdominaux","sec":"Périnée","eq":"pdc","eqt":"pdc","lv":"Débutant","ic":"🌸","d":"Serre comme pour retenir, 6 à 8 s, puis relâche complètement. 3 séries par jour. Réduit de moitié le risque d'incontinence pendant la grossesse."},{"id":161,"n":"Pompes au mur","en":"Wall Push-Up","m":"Pectoraux","sec":"Triceps, Épaules","d":"Debout face à un mur solide, mains à hauteur de poitrine. Fléchis les coudes puis repousse doucement. Rapproche les pieds pour faciliter.","eq":"pdc","eqt":"pdc","lv":"Débutant","ic":""},{"id":162,"n":"Rétraction des omoplates debout","en":"Standing Scapular Retraction","m":"Dos","sec":"Trapèzes","d":"Debout, rapproche doucement les omoplates sans hausser les épaules. Respire librement. Ce mouvement de contrôle ne remplace pas un tirage chargé.","eq":"pdc","eqt":"pdc","lv":"Débutant","ic":""},{"id":163,"n":"Squat au poids du corps","en":"Bodyweight Squat","m":"Quadriceps","sec":"Fessiers","d":"Descends dans une amplitude confortable, pieds stables et genoux dans leur axe. Remonte avec contrôle. Utilise un appui si nécessaire.","eq":"pdc","eqt":"pdc","lv":"Débutant","ic":""},{"id":164,"n":"Marche sur place","en":"March in Place","m":"Full Body","sec":"Mollets","d":"Marche à une cadence confortable, sans saut. Garde un appui à proximité si nécessaire et une respiration qui permet de parler.","eq":"pdc","eqt":"pdc","lv":"Débutant","ic":""},{"id":165,"n":"Rotation thoracique assise","en":"Seated Thoracic Rotation","m":"Dos","sec":"Abdominaux","d":"Assieds-toi sur une chaise stable. Tourne doucement le haut du buste sans forcer ni bloquer le souffle. Alterne les côtés.","eq":"pdc","eqt":"pdc","lv":"Débutant","ic":""}];

function profileModal(){const p=A.profile;modal('Ton profil, tes repères',`<form id="profileform"><p class="small muted">Le genre sert à te représenter. Il ne détermine ni ta silhouette, ni ton entraînement, ni un coefficient nutritionnel.</p><div class="fields2 inlinegap">${field('name','Prénom ou pseudo','text',p.name,'maxlength="40" required autocomplete="given-name"')}${select('gender','Genre',{homme:'Homme',femme:'Femme',nonbinaire:'Non binaire',agenre:'Agenre',fluide:'Genre fluide',autre:'Autre',nsp:'Je préfère ne pas préciser'},p.gender)}${field('pronouns','Pronoms (facultatif)','text',p.pronouns,'maxlength="30" placeholder="Ex. il, elle, iel"')}${field('age','Âge — application pour adultes','number',p.age,'min="18" max="100" required')}${field('height','Taille (cm)','number',p.height,'min="120" max="230" step="1" required')}${field('weight','Poids actuel (kg)','number',p.weight,'min="30" max="300" step="0.1" required')}</div>
 ${select('goal','Ce qui compte en priorité',{health:'Me sentir mieux / renforcer mon corps',muscle:'Développer mes muscles',strength:'Développer ma force',cardio:'Améliorer mon endurance',loss:'Faire évoluer mon poids',mobility:'Retrouver de l’aisance'},p.goal)}
 <div class="fields2">${select('level','Ton expérience',{beginner:'Je débute ou je reprends',intermediate:'Je pratique régulièrement',advanced:'Je suis expérimenté'},p.level)}${select('freq','Séances par semaine',Object.fromEntries([1,2,3,4,5,6].map(v=>[v,v+' séance'+(v>1?'s':'')])),p.freq)}${select('duration','Temps disponible',{15:'15 minutes',20:'20 minutes',30:'30 minutes',40:'40 minutes',45:'45 minutes',60:'60 minutes',75:'75 minutes',90:'90 minutes',120:'120 minutes'},p.duration)}${select('place','Ton lieu habituel',{home:'À la maison',gym:'En salle',outside:'Dehors',flex:'Ça dépend'},p.place)}</div>
 <details open><summary>Mes pratiques — choisis jusqu’à 3 priorités</summary>${checks('sports',SPORTS,p.sports)}</details>
 <details><summary>Mon matériel réellement disponible</summary><p class="small muted" style="margin-bottom:10px">Un exercice au poids du corps peut aussi demander une barre de traction, un banc ou une box. Coche uniquement ce que tu peux utiliser.</p>${checks('equipment',EQUIPMENT,p.equipment)}</details>
 <details><summary>Les zones que je veux développer</summary>${checks('priorities',Object.fromEntries(MUSCLES.filter(m=>m!=='Full Body').map(m=>[m,m])),p.priorities)}<p class="small muted inlinegap">Jusqu’à 2 priorités intégrées à la musculation. Renforcer une zone ne garantit pas une perte de gras localisée.</p></details>
 <details><summary>Mon confort et les adaptations nécessaires</summary>${checks('sensitive',SENSITIVE,p.sensitive)}<p class="small muted inlinegap">Les zones sensibles écartent les exercices qui les sollicitent. Pour une douleur nouvelle ou une blessure, un avis individualisé reste nécessaire.</p><div class="divider"></div>${checks('conditions',{pregnancy:'Grossesse',postpartum:'Post-partum',injury:'Blessure en cours',postop:'Opération récente',eating:'Suivi nutritionnel sensible / TCA',medical:'Consignes médicales nutritionnelles'},p.conditions)}<label class="check inlinegap"><input type="checkbox" name="clinicalOK" ${p.clinicalOK?'checked':''}>Grossesse / post-partum : j’ai fait le point avec mon professionnel de santé et connais les adaptations qui me concernent.</label><div class="field inlinegap"><label for="clinicalNotes">Consignes à garder sous les yeux (facultatif)</label><textarea id="clinicalNotes" name="clinicalNotes" maxlength="2000" rows="3">${esc(p.clinicalNotes)}</textarea></div></details>
 <details><summary>Nutrition, morphologie et repères chiffrés</summary>${select('formula','Coefficient de l’estimation nutritionnelle',{range:'Ne pas préciser — estimation centrale',female:'Coefficient féminin de l’équation',male:'Coefficient masculin de l’équation'},p.formula)}<p class="small muted">Cette équation populationnelle ne couvre pas toutes les situations individuelles. Le genre n’est jamais utilisé pour choisir ce coefficient.</p><div class="fields2 inlinegap">${field('goalWeight','Poids souhaité (facultatif, aucune projection automatique)','number',p.goalWeight,'min="30" max="300" step="0.1"')}${field('stepGoal','Repère de pas personnel','number',p.stepGoal,'min="500" max="30000" step="100"')}</div>${select('split','Organisation musculaire',{auto:'Automatique selon ma fréquence',full:'Corps entier',upperlower:'Haut / bas — à partir de 4 séances de musculation',ppl:'Push / Pull / Legs — 6 séances de musculation'},p.split)}</details>
 <div class="notice inlinegap">Ce profil personnalise tes séances. Avec un compte, le carnet est synchronisé ; tes choix de partage déterminent ce que ton coach peut consulter.</div><button class="btn full" type="submit">Enregistrer mon profil</button><div class="row wrap inlinegap">${btn('Allergies','nutritionprefs','small outline')}${btn('Affichage & données','preferences','small outline')}${btn('Mon avatar','avatar','small outline')}${btn('Refaire le questionnaire','onboarding','small outline')}${btn('Sauvegarde & partage','datasettings','small outline')}</div></form>`);}
function saveProfile(form){const f=new FormData(form);const p=Core.clone(A.profile);for(const k of ['name','gender','pronouns','goal','level','place','formula','split','clinicalNotes'])p[k]=String(f.get(k)||'').trim();for(const k of ['age','height','weight','goalWeight','freq','duration','stepGoal'])p[k]=Number(f.get(k))||A.profile[k];for(const k of ['sports','equipment','priorities','sensitive','conditions'])p[k]=f.getAll(k);if(p.sports.length>3)return toast('Choisis au maximum 3 pratiques prioritaires.');if(!p.sports.length)p.sports=['strength'];if(p.priorities.length>2)return toast('Choisis au maximum 2 zones prioritaires.');if(p.conditions.includes('pregnancy')&&p.conditions.includes('postpartum'))return toast('Choisis ta situation actuelle : grossesse ou post-partum.');p.equipment=[...new Set(['pdc',...p.equipment])];p.clinicalOK=f.has('clinicalOK');p.complete=true;A.profile=p;save();closeModal();render();toast('Ton suivi est personnalisé.');}
function nutritionPrefs(){const p=A.profile;modal('Allergies & préférences',`<form id="nutritionform"><p class="small muted">Allergies, intolérances et choix alimentaires sont différents. Les alertes portent sur les allergènes renseignés et les traces déclarées.</p><fieldset class="inlinegap"><legend class="eyebrow" style="margin-bottom:10px">ALLERGÈNES À SURVEILLER</legend>${checks('allergies',ALLERGENS,p.allergies)}</fieldset>${field('allergyOther','Autres allergies / précision (facultatif)','text',p.allergyOther,'maxlength="200" placeholder="Ex. kiwi, noix de cajou…"')}${select('diet','Préférence alimentaire',{all:'Sans préférence',vegetarian:'Végétarien',vegan:'Végétalien'},p.diet)}<label class="check"><input type="checkbox" name="numbers" ${A.prefs.numbers?'checked':''}>Afficher les calories et macronutriments</label><div class="notice warn inlinegap">Les bases alimentaires peuvent être incomplètes. Vérifie toujours l’étiquette, les ingrédients et les traces. Un champ vide ne garantit pas l’absence d’allergène.</div><button type="submit" class="btn full">Enregistrer</button></form>`);}
function preferences(){modal('À ta façon',`<form id="preferencesform">${[['avatar','Afficher mon avatar','Un compagnon visuel dans mon quotidien.'],['bodyGoal','Afficher un avatar objectif','Des proportions choisies, sans promesse de résultat.'],['points','Activer les points de régularité','Bonus facultatifs pour les actions, jamais pour les kilos perdus.'],['numbers','Afficher les données nutritionnelles','Peut être désactivé tout en conservant le journal.'],['motion','Autoriser les animations douces','Le réglage « réduire les animations » de ton appareil reste prioritaire.']].map(([k,l,d])=>`<label class="switchrow"><span class="grow"><strong>${l}</strong><p>${d}</p></span><input name="${k}" type="checkbox" ${A.prefs[k]?'checked':''}></label>`).join('')}<button type="submit" class="btn full inlinegap">Enregistrer mes préférences</button></form><div class="divider"></div><h3>Mes données</h3><p class="small muted inlinegap">Le carnet est enregistré ici et synchronisé avec ton compte connecté. Tu peux vérifier le statut, choisir ce que voit ton coach et exporter une copie.</p><div class="row wrap inlinegap">${btn('Sauvegarde & partage','datasettings','small secondary')}${btn('Exporter une sauvegarde','export','small outline')}${btn('Importer une sauvegarde','import','small outline')}${btn('Connexions santé','health','small outline')}</div><div class="divider"></div>${UI.member?btn('Me déconnecter','logout','full outline'):btn('Connexion à mon suivi coach','auth','full outline')}`);}
function checkinModal(energy){const c={energy:3,sleep:7,pain:0,zones:[],...checkin()};if(energy)c.energy=Number(energy);modal('Ton bilan du jour',`<form id="checkinform"><p class="small muted">Ces repères servent à adapter l’effort, sans calculer un score médical de récupération.</p><div class="fields2 inlinegap">${select('energy','Ton énergie',{1:'1 · Besoin de repos',2:'2 · Basse',3:'3 · Correcte',4:'4 · Bonne',5:'5 · Très bonne'},c.energy)}${field('sleep','Sommeil (heures)','number',c.sleep,'min="0" max="16" step="0.5"')}</div>${field('pain','Gêne ou douleur actuelle (0–10)','number',c.pain,'min="0" max="10" step="1"')}<fieldset><legend class="small muted" style="margin-bottom:10px">Zones à ménager aujourd’hui</legend>${checks('zones',SENSITIVE,c.zones||[])}</fieldset><label class="check inlinegap"><input name="newPain" type="checkbox" ${c.newPain?'checked':''}>Douleur nouvelle, inhabituelle ou aggravée par l’exercice</label><label class="check inlinegap"><input name="red" type="checkbox" ${c.red?'checked':''}>Douleur thoracique, malaise, essoufflement au repos, saignement ou trouble neurologique</label><label class="check inlinegap"><input name="lowImpact" type="checkbox" ${c.lowImpact?'checked':''}>Je préfère éviter les sauts et les impacts aujourd’hui</label><button class="btn full inlinegap" type="submit">Adapter ma journée</button></form>`);}
function saveCheckin(form){const f=new FormData(form),c={energy:Number(f.get('energy')),sleep:Number(f.get('sleep')),pain:Number(f.get('pain')),zones:f.getAll('zones'),newPain:f.has('newPain'),red:f.has('red'),lowImpact:f.has('lowImpact')};Core.day(A).checkin=c;save();closeModal();render();const g=Core.gate(A.profile,c);if(g.blocked){if(A.active&&!A.active.pausedAt)A.active.pausedAt=Date.now();if(UI.gps&&!UI.gps.paused){UI.gps.paused=true;UI.gps.pauseAt=Date.now();UI.gps.gap=true;saveGPSDraft(true);}save();render();}if(g.blocked)modal(g.title,`<div class="notice error">${esc(g.reason)}</div>${btn('Écrire à mon coach','coach','full outline')}`);else toast('Tes séances tiennent compte de ton bilan.');}
function exerciseModal(id){const e=Core.ex(id);if(!e)return;modal(e.n,`<div class="pills">${tag(e.m)}${tag(e.lv,'neutral')}${e.duo?tag('À plusieurs','orange'):''}</div><div class="row inlinegap">${bodyMap([e.m])}<div><h3>Le mouvement</h3><p class="small muted inlinegap">${esc(e.d)}</p></div></div><section class="card inlinegap"><h3>Ce qu’il te faut</h3><p class="small muted inlinegap">${e.req.length?e.req.map(k=>EQUIPMENT[k]).join(' · '):'Aucun matériel spécifique'}</p><p class="small muted inlinegap">Muscles secondaires : ${esc(e.sec)}</p></section>${e.clinical?'<div class="notice warn">Cet exercice reste une fiche informative. Son utilisation thérapeutique demande un protocole individualisé et il est exclu des programmes automatiques.</div>':`<p class="small muted inlinegap">${Core.progression(A,e.id)}</p>`}<div class="modal-foot">${btn(UI.selected.includes(e.id)?'Retirer de ma séance':'Ajouter à ma séance','selectex','',`data-id="${e.id}" data-close="true"`)}${UI.session?btn('Retour à la séance','backsession','secondary'):btn('Fermer','close','secondary')}</div>`);}
function showSession(s){UI.session=s;const format={sets:'Séries classiques',circuit:`${s.rounds} tours de circuit`,emom:`${s.rounds} tours · une station par minute`,amrap:`AMRAP · ${s.cap} minutes`,hybrid:'Course et stations alternées'};modal(s.name,`<div class="pills">${tag(SPORTS[s.sport]||'Personnalisée')}${tag(s.duration+' min','neutral')}${tag(format[s.format]||'Séance','neutral')}</div><p class="small muted inlinegap">${esc(s.description)}</p>${s.blocked?`<div class="notice error inlinegap">${esc(s.reason)}</div>`:''}${s.adaptations?.map(t=>`<div class="notice inlinegap">${esc(t)}</div>`).join('')||''}${A.profile.clinicalNotes?`<div class="notice inlinegap"><strong>Tes consignes :</strong> ${esc(A.profile.clinicalNotes)}</div>`:''}<div class="list inlinegap"><div class="session"><span class="session-art">${icon('sun')}</span><div><h3>5 min · mise en route</h3><p class="small muted">Mouvement facile, puis séries légères de préparation.</p></div></div>${s.blocks.map((b,i)=>`<div class="session"><span class="tag neutral">${i+1}</span><div class="grow"><h3>${esc(b.mode==='cardio'?b.label:Core.ex(b.id)?.n||'Exercice')}</h3><p class="small muted">${b.mode==='cardio'?b.minutes+' minutes':b.sets+' × '+b.target+' · repos '+b.rest+' s'}</p></div>${b.id?`<button class="linkbtn" data-action="exercise" data-id="${b.id}">Fiche</button>`:''}</div>`).join('')}<p class="small muted">3 min · retour au calme confortable.</p></div>${s.group?`<div class="notice inlinegap">${esc(s.group.mode)} · ${esc(s.group.place)} · ${esc(s.group.names.join(', '))}<br>Une charge et une variante par personne. Le carnet enregistre uniquement ta séance.</div>`:''}<div class="modal-foot">${btn('Commencer '+icon('play'),'start','',s.blocked?'disabled':'')}${btn('Mon bilan','checkin','secondary')}</div><details><summary>Progression & repères</summary><p>${esc(s.principle||'Garde 2 à 3 répétitions en réserve et une technique confortable.')} Pour les circuits, le chronomètre aide à respecter les temps ; arrête un bloc si le mouvement se dégrade.</p></details>`);}
function beginSession(){if(A.active){closeModal();go('live');return toast('Reprends ou termine la séance déjà ouverte.');}if(!A.profile.complete){profileModal();return toast('Renseigne ton profil avant de commencer.');}const s=UI.session;if(!s)return;const gate=Core.gate(A.profile,checkin());if(gate.blocked||s.blocked)return toast(gate.reason||s.reason);if(A.profile.conditions.includes('pregnancy')&&!['prenatal','mobility'].includes(s.sport)||A.profile.conditions.includes('postpartum')&&!['postpartum','mobility'].includes(s.sport))return toast('Rouvre ton programme adapté après ce changement de profil.');if(s.blocks.some(b=>b.id&&!Core.eligible(Core.ex(b.id),A.profile,checkin(),{group:!!s.group})))return toast('Ton profil a changé : rouvre cette séance pour l’adapter.');
 const last=(id)=>A.history.slice().reverse().flatMap(h=>h.ex||[]).find(x=>x.id===id)?.sets.filter(s=>s.done&&s.kind!=='warmup')||[];
 A.active={id:uid(),name:s.name,sport:s.sport,format:s.format,cap:s.cap||null,week:A.week,started:Date.now(),lastHeartbeat:Date.now(),pausedAt:null,pausedTotal:0,group:s.group||null,note:'',ex:s.blocks.map((b,xi)=>({id:b.id||null,label:b.label||'',cardio:b.cardio||null,mode:b.mode==='cardio'?'time':b.mode,target:b.mode==='cardio'?b.minutes*60:b.value,rest:b.rest||0,superset:null,sets:Array.from({length:(b.sets||1)*(s.rounds||1)},(_,i)=>({weight:last(b.id)[i]?.weight??'',reps:'',seconds:'',meters:'',rpe:'',done:false,kind:'work'}))}))};save();closeModal();go('live');}
function liveSeconds(){const a=A.active;return a?Math.max(0,((a.pausedAt||Date.now())-a.started-a.pausedTotal)/1000):0;}
function renderLive(){const a=A.active;if(!a)return head('Séance terminée','Tu peux retrouver ton carnet.')+btn('Mon entraînement','train');return head(esc(a.name),'Note ce que tu fais vraiment. Ajuste dès que nécessaire.',btn('Terminer','finish',''))+`<div class="livebanner"><span class="row">${icon('clock')}<strong id="liveclock">${duration(liveSeconds())}</strong>${a.pausedAt?' · en pause':''}</span><div class="row">${btn(a.pausedAt?'Reprendre':'Pause','pauselive','small outline')}${btn('Adapter','adaptlive','small outline')}</div></div>${['circuit','emom'].includes(a.format)?'<div class="notice">Travaille une série par station, puis passe à la station suivante. Reviens à la première pour le tour suivant. Le numéro de série correspond au tour. '+(a.format==='emom'?'Dans ce format : 35 s de mouvement et 25 s pour changer de station.':'Respecte le temps prévu entre stations.')+'</div>':''}${a.format==='amrap'?`<div class="notice">AMRAP : repère de ${a.cap} minutes. Ajoute un tour seulement si tu continues avec une technique maîtrisée. ${btn('Minuteur du bloc','blocktimer','small secondary',`data-seconds="${a.cap*60}"`)}</div>`:''}<p class="small muted" style="margin-bottom:17px">Charge = total des poids externes déplacés (deux haltères de 10 kg → 20 kg). Poids du corps : 0 kg. Échauffe-toi progressivement avant les séries de travail.</p>${a.ex.map((x,xi)=>{const e=Core.ex(x.id);return `<section class="exercise-card"><div class="between"><div><span class="eyebrow">${xi+1} / ${a.ex.length}${x.superset?' · GROUPE '+esc(x.superset):''}</span><h2 style="font-size:17px;margin-top:5px">${esc(e?.n||x.label)}</h2></div>${e?btn('Options','exoptions','small outline',`data-id="${xi}"`):''}</div><p class="small muted" style="margin-top:8px">${x.mode==='reps'?'Repère : '+Math.max(1,x.target-2)+'–'+x.target+' répétitions · repos '+x.rest+' s':x.mode==='distance'?'Repère : '+x.target+' m':'Repère : '+duration(x.target)+' · '+(x.cardio?'allure confortable':'souffle libre')}${x.superset?' · repos après le dernier exercice du groupe':''}</p><div class="sethead"><span>SÉRIE</span><span>${x.mode==='reps'?'KG':'KG (OPT.)'}</span><span>${x.mode==='reps'?'RÉP.':x.mode==='time'?'SECONDES':'MÈTRES'}</span><span>EFFORT /10</span><span>FAIT</span></div>${x.sets.map((s,si)=>`<div class="setrow ${s.done?'done':''}"><div class="setnumber">${si+1}<button class="setkind" data-action="setkind" data-id="${xi}" data-set="${si}" aria-label="Type de série ${si+1}">${s.kind==='warmup'?'ÉCH.':'TRAV.'}</button></div><input type="number" min="0" max="1500" step="0.5" value="${esc(s.weight)}" placeholder="0" data-setfield="weight" data-ex="${xi}" data-set="${si}" aria-label="Charge exercice ${xi+1} série ${si+1}"><input type="number" min="1" max="${x.mode==='time'?14400:x.mode==='distance'?100000:300}" value="${esc(x.mode==='reps'?s.reps:x.mode==='time'?s.seconds:s.meters)}" placeholder="${x.target}" data-setfield="${x.mode==='reps'?'reps':x.mode==='time'?'seconds':'meters'}" data-ex="${xi}" data-set="${si}" aria-label="${x.mode==='reps'?'Répétitions':x.mode==='time'?'Secondes':'Mètres'} exercice ${xi+1} série ${si+1}"><input type="number" min="1" max="10" step="1" value="${esc(s.rpe)}" placeholder="—" data-setfield="rpe" data-ex="${xi}" data-set="${si}" aria-label="Effort sur dix exercice ${xi+1} série ${si+1}"><button class="setcheck" data-action="checkset" data-id="${xi}" data-set="${si}" aria-pressed="${s.done}" aria-label="Valider exercice ${xi+1} série ${si+1}">${icon('check')}</button></div>`).join('')}${x.id&&!Core.eligible(e,A.profile,checkin(),{group:!!a.group})?'<div class="notice warn">À adapter au bilan actuel : remplace cet exercice ou retire les séries restantes dans Options.</div>':''}<div class="between">${btn('+ Une série','addset','small outline',`data-id="${xi}"`)}${x.mode==='time'?btn('Minuteur','blocktimer','small secondary',`data-seconds="${x.target}"`):''}</div></section>`;}).join('')}<section class="card"><div class="field"><label for="livenote">Une note pour la prochaine fois</label><textarea id="livenote" maxlength="2000" rows="3" placeholder="Technique, sensations, matériel…">${esc(a.note)}</textarea></div>${btn('Terminer ma séance','finish','full')}<button class="linkbtn" data-action="discardlive">Annuler cette séance</button></section>`;}
function setComplete(xi,si){const a=A.active;if(!a)return;const x=a.ex[xi],s=x.sets[si];if(s.done){s.done=false;save();render();return;}if(document.querySelector('[data-setfield]:invalid'))return toast('Corrige les champs hors limites avant de valider.');if(a.pausedAt)return toast('Reprends la séance avant de valider une série.');const g=Core.gate(A.profile,checkin());if(g.blocked)return toast(g.reason);if(x.id&&!Core.eligible(Core.ex(x.id),A.profile,checkin(),{group:!!a.group}))return toast('Cet exercice ne correspond plus aux adaptations du jour. Change-le ou retire les séries restantes.');if(A.profile.conditions.includes('pregnancy')&&!['prenatal','mobility'].includes(a.sport)||A.profile.conditions.includes('postpartum')&&!['postpartum','mobility'].includes(a.sport))return toast('Termine les éléments déjà faits puis ouvre ton nouveau parcours adapté.');const v=x.mode==='reps'?s.reps:x.mode==='time'?s.seconds:s.meters;if(!Number.isFinite(Number(v))||Number(v)<=0||Number(v)>(x.mode==='reps'?300:x.mode==='time'?14400:100000))return toast('Note les '+(x.mode==='reps'?'répétitions':x.mode==='time'?'secondes':'mètres')+' réalisés avant de valider.');if(Number(s.weight)<0||Number(s.weight)>1500||Number(s.rpe)<0||Number(s.rpe)>10)return toast('Vérifie la charge et l’effort renseignés.');s.done=true;const shouldRest=!x.superset||!a.ex.slice(xi+1).some(e=>e.superset===x.superset);save();render();if(shouldRest&&x.rest)startRestTimer(x.rest);}
function startRestTimer(seconds,label='Récupération'){UI.restUntil=Date.now()+Number(seconds)*1000;UI.restLabel=label;tickRest();}
function tickRest(){const e=$('restbar');if(!UI.restUntil){e.style.display='none';return;}const left=Math.max(0,(UI.restUntil-Date.now())/1000);if(left<=0){UI.restUntil=null;e.style.display='none';toast(UI.restLabel==='Récupération'?'Temps de repos terminé. Repars quand tu es prêt.':'Bloc terminé.');if(A.prefs.motion)navigator.vibrate?.(80);return;}e.style.display='flex';e.innerHTML=`<span>${esc(UI.restLabel)}</span><strong>${duration(left)}</strong><button data-action="restadd">+ 15 s</button><button data-action="reststop" aria-label="Arrêter le minuteur">${icon('close')}</button>`;}

async function startCamera(){if(!('BarcodeDetector'in window)||!navigator.mediaDevices?.getUserMedia)return toast('Le scan caméra n’est pas disponible ici. Saisis le code-barres.');try{cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});if(!$('camera-area')){stopCamera();return;}$('camera-area').innerHTML='<video id="barcodevideo" autoplay playsinline muted style="width:100%;border-radius:16px;margin-top:15px"></video>';$('barcodevideo').srcObject=cameraStream;const supported=await BarcodeDetector.getSupportedFormats();const formats=['ean_13','ean_8','upc_a','upc_e'].filter(f=>supported.includes(f));if(!formats.length)throw new Error();const detector=new BarcodeDetector({formats});const scan=async()=>{const v=$('barcodevideo');if(!v||!cameraStream)return;try{const rs=await detector.detect(v);if(rs[0]){const code=rs[0].rawValue;stopCamera();fetchBarcode(code);return;}}catch{}cameraTimer=setTimeout(scan,400);};cameraTimer=setTimeout(scan,600);}catch{stopCamera();toast('Caméra inaccessible. La saisie du code reste disponible.');}}

const Vault = (() => {
  let opened;
  function open() {
    if (!globalThis.indexedDB) return Promise.resolve(null);
    if (!opened) opened = new Promise((resolve, reject) => {
      const req = indexedDB.open('forma-journals', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('records');
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
      req.onblocked = () => reject(new Error('Ferme les autres onglets FORMA puis réessaie.'));
    });
    return opened;
  }
  async function read(key) {
    const db = await open(); if (!db) return null;
    return new Promise((resolve,reject) => {
      const req = db.transaction('records').objectStore('records').get(key);
      req.onsuccess = () => resolve(req.result || null); req.onerror = () => reject(req.error);
    });
  }
  async function write(key, record, expected) {
    const db = await open(); if (!db) return null;
    return new Promise((resolve,reject) => {
      const tx = db.transaction('records','readwrite'), store = tx.objectStore('records');
      const get = store.get(key); let next, collision=false;
      get.onsuccess = () => {
        const version = get.result?.version || 0;
        if (expected != null && version !== expected) { collision=true;tx.abort(); return; }
        next = version + 1; store.put({...record,version:next},key);
      };
      tx.oncomplete = () => resolve(next);
      tx.onerror = () => reject(tx.error || new Error('La sauvegarde locale a échoué.'));
      tx.onabort = () => {const error=new Error(collision?'Un autre onglet a modifié ce carnet. Rapproche les deux versions.':'La sauvegarde locale a été interrompue.');if(collision)error.code='CONCURRENT_WRITE';reject(error);};
    });
  }
  async function erase(key) {
    const db=await open();if(!db)return;
    return new Promise((resolve,reject)=>{
      const tx=db.transaction('records','readwrite'),req=tx.objectStore('records').openCursor();
      req.onsuccess=()=>{const cursor=req.result;if(!cursor)return;const value=String(cursor.key);if(value===key||value===key+'_gps'||value===key+'_conflict'||value.startsWith('recovery:'+key+':'))cursor.delete();cursor.continue();};
      tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
    });
  }
  return {read,write,erase};
})();

async function initJournal() {
  const key=storageKey, epoch=UI.editEpoch||0, auth=UI.authVersion;
  UI.vaultVersion=0;
  try {
    const record=await Vault.read(key);
    if(key!==storageKey||auth!==UI.authVersion)return;
    if(record){
      UI.vaultVersion=record.version;
      if(epoch===(UI.editEpoch||0)){
        const mirrorTime=Number(localStorage.getItem(key+'_at')||0);
        if(record.updated>=mirrorTime)A=Core.normalize(record.state);
        syncMeta=record.meta||{revision:0,base:null,dirty:false,updated:null};
        if(mirrorTime>record.updated)syncMeta.dirty=true;
      }
    }else{
      try{syncMeta=JSON.parse(localStorage.getItem(key+'_sync')||'null')||{revision:0,base:null,dirty:false,updated:null};}catch{syncMeta={revision:0,base:null,dirty:false,updated:null};}
    }
    UI.vaultReady=true; UI.localError=false;
    saveStatus(UI.member?'Carnet chargé sur cet appareil':'Enregistré sur cet appareil');
  }catch(e){UI.vaultReady=true;UI.localError=false;saveStatus('Sauvegarde navigateur disponible ; base locale indisponible.');}
  if(key!==storageKey||auth!==UI.authVersion)return;
  let conflict;try{conflict=JSON.parse(localStorage.getItem(key+'_conflict')||'null');}catch{}
  try{const saved=await Vault.read(key+'_conflict');if(saved)conflict=saved.conflict;}catch{}
  if(key!==storageKey||auth!==UI.authVersion)return;
  if(conflict?.local&&conflict?.remote){UI.syncConflict=conflict;UI.conflictSaved=true;if(conflict.kind==='tab')A=Core.normalize(conflict.local);saveStatus('Deux versions à rapprocher');}
}
async function keepSyncConflict(conflict,key,auth){
  let saved=false;
  try{localStorage.setItem(key+'_conflict',JSON.stringify(conflict));saved=true;}catch{}
  try{const version=await Vault.write(key+'_conflict',{conflict,updated:Date.now()},null);saved=saved||version!=null;}catch{}
  if(key===storageKey&&auth===UI.authVersion)UI.conflictSaved=saved;
  return saved;
}
function persistJournal({remote=false}={}) {
  UI.editEpoch=(UI.editEpoch||0)+1;
  if(!remote)syncMeta.dirty=true;
  const key=storageKey,auth=UI.authVersion,at=Date.now(),state=Core.clone(A),meta=Core.clone(syncMeta);
  if(UI.syncConflict?.kind==='tab'){
    UI.syncConflict.local=state;const conflict=Core.clone(UI.syncConflict);
    persistChain=persistChain.then(()=>keepSyncConflict(conflict,key,auth));
    saveStatus('Deux onglets ont modifié le carnet · choisis la version à conserver');return true;
  }
  let mirror=false;
  try{
    localStorage.setItem(key,JSON.stringify(state));localStorage.setItem(key+'_at',String(at));
    // Keep only metadata in the small mirror; the merge baseline lives in IndexedDB.
    localStorage.setItem(key+'_sync',JSON.stringify({...meta,base:null}));mirror=true;
  }catch{}
  const commit=async()=>{
    if(key!==storageKey||auth!==UI.authVersion)return;
    try{
      const version=await Vault.write(key,{state,meta,updated:at},UI.vaultVersion??0);
      if(key!==storageKey||auth!==UI.authVersion)return;
      if(version!=null)UI.vaultVersion=version;
      if(version==null&&!mirror)throw new Error('La sauvegarde a échoué. Exporte tes données avant de fermer.');
      UI.localError=false;if($('saveerror'))$('saveerror').hidden=true;
      if(!UI.syncBusy)saveStatus(UI.member?.role==='client'?(syncMeta.dirty?'Sauvé ici · synchronisation en attente':'Sauvegardé sur ton compte'):'Enregistré sur cet appareil');
    }catch(e){
      if(key!==storageKey||auth!==UI.authVersion)return;
      UI.localError=true;saveStatus(e.message,true);
      if(e.code==='CONCURRENT_WRITE'){
        try{const current=await Vault.read(key);if(key!==storageKey||auth!==UI.authVersion||!current)return;
          UI.syncConflict={kind:'tab',local:Core.clone(A),remote:current.state,meta:current.meta,version:current.version};
          await keepSyncConflict(UI.syncConflict,key,auth);
          if(key===storageKey&&auth===UI.authVersion)syncConflictModal();
        }catch{}
      }
    }
  };
  persistChain=persistChain.then(commit,commit);
  if(!remote){clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncJournal(),1800);}
  return mirror||!!globalThis.indexedDB;
}
function applyCloudState(remote) {
  Core.validate(remote);
  const device={health:A.health,draft:A.draft,outbox:A.outbox,coachDrafts:A.coachDrafts,legacy:A.legacy};
  A=Core.normalize(remote);Object.assign(A,device);
  if(A.active&&!A.active.pausedAt)A.active.pausedAt=A.active.lastHeartbeat||A.active.started;
}
async function syncJournal(manual=false) {
  if(UI.syncBusy||UI.syncConflict||UI.localError||!UI.api||UI.member?.role!=='client'||navigator.onLine===false)return;
  if(A.active||UI.gps){if(manual)toast('Le carnet se synchronisera à la fin de l’activité. La sauvegarde locale reste active.');return;}
  UI.syncBusy=true;const auth=UI.authVersion,key=storageKey;
  try{
    await persistChain;saveStatus('Synchronisation…');
    if(!syncMeta.dirty){const status=await api('/state/status');if(auth!==UI.authVersion||key!==storageKey)return;if(status.revision===syncMeta.revision&&syncMeta.revision>0){saveStatus('Sauvegardé sur ton compte');if(manual)toast('Ton carnet est à jour.');return;}}
    const remote=await api('/state');if(auth!==UI.authVersion||key!==storageKey)return;
    const local=cloudState(A);
    if(!syncMeta.dirty&&remote.state){applyCloudState(remote.state);syncMeta={revision:remote.revision,base:remote.state,dirty:false,updated:remote.updated};persistJournal({remote:true});if(UI.page!=='onboarding')render();}
    else if(remote.state&&sameValue(local,remote.state)){syncMeta={revision:remote.revision,base:remote.state,dirty:false,updated:remote.updated};persistJournal({remote:true});}
    else {
      if(remote.state&&remote.revision!==syncMeta.revision){
        const merged=syncMeta.base?mergeJournals(syncMeta.base,local,remote.state):{conflicts:['carnet'],state:local};
        if(merged.conflicts.length){
          UI.syncConflict={local,remote:remote.state,revision:remote.revision,updated:remote.updated};
          const kept=await keepSyncConflict(UI.syncConflict,key,auth);
          if(auth!==UI.authVersion||key!==storageKey)return;
          saveStatus(kept?'Deux versions à rapprocher':'Télécharge les deux versions avant de fermer : stockage indisponible.',!kept);if(manual)syncConflictModal();return;
        }
        applyCloudState(merged.state);syncMeta.revision=remote.revision;
      }
      const sent=cloudState(A),epoch=UI.editEpoch||0;
      const r=await api('/state',{base_revision:remote.revision,request_id:uid(),state:sent});
      if(auth!==UI.authVersion||key!==storageKey)return;
      syncMeta={revision:r.revision,base:sent,dirty:epoch!==(UI.editEpoch||0),updated:r.updated};persistJournal({remote:true});
    }
    if(manual)toast('Ton carnet est sauvegardé sur ton compte.');
    saveStatus(syncMeta.dirty?'Nouveaux changements en attente':'Sauvegardé sur ton compte');
  }catch(e){
    if(e.status===409){saveStatus('Autre appareil détecté · nouvelle vérification');clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncJournal(),1200);}
    else {saveStatus(e.status===401?'Reconnecte-toi pour synchroniser':'Sauvé ici · connexion à rétablir');if(manual)toast(e.message);}
  }finally{UI.syncBusy=false;}
}
function syncConflictModal() {
  if(!UI.syncConflict)return syncJournal(true);
  modal('Deux carnets à rapprocher',`<p class="small muted">${UI.syncConflict.kind==='tab'?'Deux onglets ont modifié ce carnet.':'Cet appareil et un autre ont modifié les mêmes informations.'} ${UI.conflictSaved?'Une copie de récupération des deux versions a été gardée ici.':'Le stockage est indisponible : télécharge les deux versions avant de fermer.'} Choisis celle à utiliser ; rien n’est remplacé sans ce choix.</p><div class="stack inlinegap">${btn('Télécharger les deux versions','exportconflict','outline')}${btn('Utiliser le carnet de cet appareil','conflictlocal')}${btn(UI.syncConflict.kind==='tab'?'Utiliser le carnet de l’autre onglet':'Utiliser la sauvegarde du compte','conflictremote','secondary')}</div>`);
}
async function resolveSyncConflict(useLocal) {
  const conflict=UI.syncConflict;if(!conflict)return;
  if(!useLocal)applyCloudState(conflict.remote);
  if(conflict.kind==='tab'){
    const queued=[...(conflict.remote.outbox||[]),...(A.outbox||[])];A.outbox=[...new Map(queued.map(m=>[m.id,m])).values()];
    syncMeta={...(conflict.meta||{revision:0,base:null,updated:null}),dirty:true};UI.vaultVersion=conflict.version;
  }else syncMeta={revision:conflict.revision,base:conflict.remote,dirty:useLocal,updated:conflict.updated};
  UI.syncConflict=null;UI.localError=false;
  const key=storageKey,auth=UI.authVersion;
  persistJournal({remote:true});await persistChain;
  if(key!==storageKey||auth!==UI.authVersion)return;
  if(UI.localError){UI.syncConflict||=conflict;return;}
  try{localStorage.removeItem(key+'_conflict');}catch{}
  try{await Vault.write(key+'_conflict',{conflict:null,updated:Date.now()},null);}catch{}
  closeModal();render();if(useLocal)await syncJournal(true);
}

function captureSetup(form){

 strings.forEach(k=>p[k]=String(f.get(k)||'').trim());numbers.forEach(k=>p[k]=Number(f.get(k)));arrays.forEach(k=>p[k]=f.getAll(k));

}

 let result;try{result=await response.json();}catch{throw new Error('Le service FORMA n’est pas disponible à cette adresse.');}

 return result;
